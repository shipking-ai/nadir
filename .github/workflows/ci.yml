name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs (tag shown in the comment); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Dependency audit (production)
        run: npm run audit
      - name: Licence gate (fails on unknown production licences)
        run: node scripts/license-inventory.js
      - name: End-to-end tests (includes axe accessibility scan and badssl.com TLS tests)
        run: npm run test:e2e
      - name: Package
        run: npm run package
      - name: Packaged-app smoke test
        run: node scripts/verify-package.js
      - name: SBOM (CycloneDX, production dependencies)
        run: npm sbom --sbom-format cyclonedx --omit dev > nadir-sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nadir-ci-${{ github.sha }}
          path: |
            nadir-sbom.cdx.json
            docs/benchmarks/a11y-axe-latest.json
          if-no-files-found: error
          retention-days: 14
