name: Release

# Runs when a tag like v0.1.0 is pushed. Builds from the tagged commit on a GitHub-hosted runner, runs the full
# test suite, packages, (optionally) signs, publishes a GitHub pre-release with checksums and an SBOM, and records a
# build-provenance attestation so anyone can check that the zip came from this repository and this workflow:
#     gh attestation verify Nadir-<version>-win32-x64.zip --repo shipking-ai/nadir
#
# SIGNING: the signing step is skipped unless the repository secret NADIR_SIGN_PFX_B64 (base64 .pfx) and
# NADIR_SIGN_PFX_PASSWORD exist. That step has NEVER been run with a real certificate. Until one exists, every
# release from this workflow is UNSIGNED and the release notes say so.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  release:
    name: Build, test, publish
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write        # create the release
      id-token: write        # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Tag must match package.json
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME}" = "v${v}" ] || [ "${GITHUB_REF_NAME#v${v}-}" != "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${v}"; exit 1; }
          echo "VERSION=${v}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run audit
      - run: node scripts/license-inventory.js
      - run: npm run test:e2e
      - run: npm run package
      - run: node scripts/verify-package.js
      - name: Detect signing certificate
        id: cert
        shell: bash
        env:
          PRESENT: ${{ secrets.NADIR_SIGN_PFX_B64 != '' }}
        run: echo "present=${PRESENT}" >> "$GITHUB_OUTPUT"
      - name: Sign Nadir.exe (only when a certificate secret exists; untested with a real certificate)
        if: steps.cert.outputs.present == 'true'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.NADIR_SIGN_PFX_B64 }}
          NADIR_SIGN_PFX_PASSWORD: ${{ secrets.NADIR_SIGN_PFX_PASSWORD }}
          NADIR_TIMESTAMP_URL: ${{ vars.NADIR_TIMESTAMP_URL }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $env:NADIR_SIGN_PFX = $pfx
          powershell -NoProfile -File scripts/sign.ps1
          $code = $LASTEXITCODE
          [IO.File]::Delete($pfx)
          if ($code -ne 0) { throw "signing failed or signature not valid (exit $code)" }
      - name: Archive, checksums, SBOM
        shell: bash
        run: |
          zip="Nadir-${VERSION}-win32-x64.zip"
          tar -a -c -f "$zip" -C out Nadir-win32-x64
          sha256sum "$zip" > SHA256SUMS.txt
          npm sbom --sbom-format cyclonedx --omit dev > "nadir-${VERSION}-sbom.cdx.json"
          echo "ZIP=${zip}" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Nadir-*-win32-x64.zip
      - name: Publish pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.cert.outputs.present }}
        run: |
          if [ "$SIGNED" = "true" ]; then sigline="Nadir.exe is Authenticode-signed (see the signing policy)."; else sigline="**This build is NOT code-signed.** Windows SmartScreen will warn about an unknown publisher. Verify the download instead (below)."; fi
          cat > notes.md <<EOF
          Nadir ${VERSION} - pre-release for Windows x64. Not production-ready: no third-party security review, no installer, no auto-update, only tested on Windows.

          ${sigline}

          **Verify this download**
          - SHA-256: see \`SHA256SUMS.txt\`
          - Build provenance (proves it was built from this repository by this workflow): \`gh attestation verify ${ZIP} --repo ${GITHUB_REPOSITORY}\`
          - Dependencies: \`nadir-${VERSION}-sbom.cdx.json\` (CycloneDX)

          Known gaps and the full to-do list: HANDOFF.md. Security reports: docs/SECURITY.md. Signing policy: docs/CODE-SIGNING-POLICY.md.
          EOF
          gh release create "${GITHUB_REF_NAME}" "${ZIP}" SHA256SUMS.txt "nadir-${VERSION}-sbom.cdx.json" \
            --title "Nadir ${VERSION} (pre-release)" --notes-file notes.md --prerelease --verify-tag
