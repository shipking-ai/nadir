<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<link rel="stylesheet" href="pelorus://assets/tokens.css">
<link rel="stylesheet" href="pelorus://assets/pages.css">
</head>
<body class="page">
  <main class="nt">
    <h1 class="sr-only">New tab</h1>
    <div class="ws-line"><span class="dot" id="ws-dot"></span><span id="ws-name"></span></div>
    <form id="f" role="search">
      <span class="search-ic" id="sic"></span>
      <input class="search" id="q" type="text" spellcheck="false" autocomplete="off" aria-label="Search or enter address" placeholder="Search or enter address">
    </form>
    <section aria-labelledby="h-top"><h2 id="h-top">Most visited</h2><div class="tiles" id="top"></div></section>
    <section aria-labelledby="h-bm"><h2 id="h-bm">Bookmarks</h2><div class="tiles" id="bm"></div></section>
    <p class="foot" id="foot"></p>
  </main>
  <script src="pelorus://assets/icons.js"></script>
  <script src="pelorus://assets/newtab.js"></script>
</body>
</html>
